name: Deploy

# main へマージされた変更を自動でデプロイする。
#
# 人の手で `wrangler deploy` を叩く運用では、実際に次の 2 つが起きた。
#   1. コードを直したのにデプロイを忘れ、古いコードが動いたままになった。
#   2. デプロイしたが全リクエストが error 1101 で失敗しており、
#      次に誰かが叩くまで誰も気づかなかった。
#
# そのため、このワークフローは「デプロイする」だけでなく
# **デプロイ後に /health を叩いて ok が返ることを確認する**まで行う。
# 確認が通らなければワークフローを失敗させる。デプロイの成功と
# サーバーが動いていることは別の事実であり、前者だけでは足りない。
#
# 【外部アクションについて】
# `cloudflare/wrangler-action` は使わない。サードパーティのアクションは実行の
# たびにダウンロードされ、レート制限などの外部要因で失敗する（このリポジトリの
# 失敗談ストアに、pnpm/action-setup が 429 で落ちた記録がある）。
# `npx wrangler deploy` で代替できるため、依存を増やさない。
# `actions/checkout` と `actions/setup-node` は GitHub 自身のもので、
# 代替手段が無い（checkout）か、Node のバージョンを固定する価値がある
# （setup-node）ため使用する。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# デプロイは直列に行う。実行中のものを打ち切ると、中途半端な状態が残りうる。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係の取得
        run: npm ci

      - name: 型検査
        run: npm run typecheck

      # デプロイ前にバンドルが生成できることを確かめる。
      # 認証を要さないため、pull_request でもここまでは実行される。
      - name: ビルドの検証
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: デプロイ
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # 公開リポジトリの Actions のログは誰でも閲覧できる。wrangler は
          # デプロイ先の URL を出力するため、成功時はログへ出さず、
          # 失敗時のみ内容を表示する（調査に必要なため）。
          if ! npx wrangler deploy > deploy.log 2>&1; then
            echo "::group::wrangler deploy の出力"
            cat deploy.log
            echo "::endgroup::"
            exit 1
          fi
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -n "$url" ]; then
            echo "::add-mask::$url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "デプロイに成功しました。"
          else
            echo "::warning::デプロイは成功しましたが、出力から URL を取得できませんでした。疎通確認を行いません。"
          fi

      # デプロイの成功は、サーバーが動いていることを意味しない。
      # 起動時ではなくリクエスト時に失敗する不具合（error 1101）を実際に経験している。
      - name: デプロイ先の疎通確認
        if: github.event_name != 'pull_request' && steps.deploy.outputs.url != ''
        run: |
          target="${{ steps.deploy.outputs.url }}/health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS --max-time 20 "$target" 2>&1 || true)"
            if [ "$body" = '{"status":"ok"}' ]; then
              echo "疎通確認に成功しました（試行 ${attempt} 回目）。"
              exit 0
            fi
            echo "試行 ${attempt} 回目: 期待した応答ではありません。応答: ${body}"
            sleep 5
          done
          echo "::error::デプロイ後の /health が {\"status\":\"ok\"} を返しませんでした。最後の応答: ${body}"
          echo "::error::misconfigured が返る場合はシークレットの未設定、それ以外は実行時エラーの可能性があります。wrangler tail でログを確認してください。"
          exit 1
